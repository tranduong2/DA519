services:
  - type: web
    name: dalatshop-api
    runtime: node
    plan: free
    region: singapore
    rootDir: my-app/dalat-api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
